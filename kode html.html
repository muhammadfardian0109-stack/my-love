<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: radial-gradient(circle,#ffe6f2,#ffcce6,#ffb6d9);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
}

.container{
    position:relative;
    width:700px;
    height:650px;
}

.text{
    position:absolute;
    color:#ff1493;
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    animation:
        blink 2s infinite,
        float 3s ease-in-out infinite;
    text-shadow:0 0 10px #ff69b4;
}

@keyframes blink{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }
    50%{
        opacity:.4;
        transform:scale(1.2);
    }
}

@keyframes float{
    0%,100%{
        translate:0 0;
    }
    50%{
        translate:0 -8px;
    }
}
</style>
</head>
<body>

<div class="container" id="heart"></div>

<script>
const container = document.getElementById("heart");

const scale = 18;

for(let t=0; t<Math.PI*2; t+=0.06){

    const x = 16*Math.pow(Math.sin(t),3);
    const y =
      13*Math.cos(t)
      -5*Math.cos(2*t)
      -2*Math.cos(3*t)
      -Math.cos(4*t);

    const text=document.createElement("div");
    text.className="text";
    text.innerHTML="I LOVE YOU";

    text.style.left=(350 + x*scale)+"px";
    text.style.top=(300 - y*scale)+"px";

    text.style.animationDelay=(Math.random()*2)+"s";
    text.style.fontSize=(12+Math.random()*6)+"px";
    text.style.transform=`rotate(${Math.random()*20-10}deg)`;

    container.appendChild(text);
}
</script>

</body>
</html>
